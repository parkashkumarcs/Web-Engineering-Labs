<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>App Download Page</h1>
        
    </header>

    <div class="app-details">
        <div class="app-info">
            <img src="images/pubg.png" alt="Your App Name">
            <h2>Pubg Mobile</h2>
            <div class="rating">
                ★★★★★
            </div>
            <p>Total Downloads: 1M+</p>
            <a href="#" class="download-button">Download Now</a>
        </div>

        <div class="app-banner">

            <img src="Banners/pub1.png" alt="App Screenshot">
            <img src="Banners/pub2.jpg" alt="App Screenshot">
            <img src="Banners/pub3.png" alt="App Screenshot">
            <img src="Banners/pub4.png" alt="App Screenshot">

        </div>
    </div>

    <section class="comments-section">
        <h2>Comments and Feedback</h2>

        <form>
            <textarea placeholder="Leave your feedback here"></textarea>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <button type="submit">Submit</button>
        </form>
    </section>

    <footer>
        <div class="contact-info">
            <h3>Contact Us</h3>

            <p>Email: parkashkumar.bscs.official@gmail
                .com</p>
            <p>Phone: +1234567890</p>
        </div>
    </footer>
</body>
</html>
